# dnsmasq.conf — Cosmos-Nebula DHCP and DNS
# Placeholders are replaced by 01-network-ap.sh from install.conf values.

# Only serve DHCP on the AP interface
interface=__IFACE__
bind-interfaces

# DHCP range for the AP subnet
dhcp-range=__DHCP_START__,__DHCP_END__,255.255.255.0,24h

# Static lease for Cosmos — ensures it always gets the same IP
# COSMOS_MAC is XX:XX:XX:XX:XX:XX until filled in after first boot
dhcp-host=__COSMOS_MAC__,__COSMOS_HOSTNAME__,__COSMOS_IP__,infinite

# DNS: resolve klipper-host to this machine's AP IP
address=/klipper-host/__AP_IP__

# DNS: resolve cosmos-nebula to Cosmos's IP
address=/__COSMOS_HOSTNAME__/__COSMOS_IP__

# Use upstream DNS for everything else (via eth0)
server=8.8.8.8
server=1.1.1.1
