# hostapd.conf — Cosmos-Nebula WiFi access point
# Placeholders are replaced by 01-network-ap.sh from install.conf values.

interface=__IFACE__
driver=nl80211
ssid=__SSID__
hw_mode=g
channel=__CHANNEL__
ieee80211n=1
wmm_enabled=1
country_code=__COUNTRY__
ieee80211d=1

macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0

wpa=2
wpa_passphrase=__PASSWORD__
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP
