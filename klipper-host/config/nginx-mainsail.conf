# nginx site config for Mainsail + Moonraker proxy
# __MAINSAIL_DIR__ is replaced by 06-nginx.sh

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root __MAINSAIL_DIR__;
    index index.html;

    # Mainsail static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Moonraker WebSocket
    location /websocket {
        proxy_pass http://127.0.0.1:7125/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Moonraker REST API
    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://127.0.0.1:7125$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Moonraker file uploads (no size limit for G-code files)
    location /server/files/upload {
        proxy_pass http://127.0.0.1:7125/server/files/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 0;
    }

    # Crowsnest camera stream
    location /webcam/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
