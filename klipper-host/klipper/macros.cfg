# macros.cfg — Cosmos-Nebula print macros
# Adapted from upstream OpenCentauri macros.

[gcode_macro _GLOBAL_VARS]
variable_extruder_target: 230
gcode:

[gcode_macro PRINT_START]
gcode:
    SET_GCODE_VARIABLE MACRO=_GLOBAL_VARS VARIABLE=extruder_target VALUE={params.EXTRUDER_TEMP}

# Home Z axis using the configured probe (load cell or Klicky).
[gcode_macro PROBE_Z_HOME]
gcode:
    SAVE_GCODE_STATE NAME=probe_z_home_state

    G91
    G1 Z2 F600
    G90

    PROBE

    M400
    SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z

    G91
    G1 Z2 F600
    M400
    G90

    RESTORE_GCODE_STATE NAME=probe_z_home_state

# Nozzle wipe routine (matches original Elegoo wipe tray position).
[gcode_macro M729]
gcode:
    SAVE_GCODE_STATE NAME=m729_saved_state

    G90
    G1 X202 F6000
    G1 Y264.5 F6000

    G1 X173 F8000
    G1 X187
    G1 X173
    G1 X187
    G1 X173

    G1 Y262.5

    G1 X187 F8000
    G1 X173
    G1 X187
    G1 X173
    G1 X187
    G1 X173

    G1 Y250
    G1 X202
    G1 Y264.5 F1200

    M400
    RESTORE_GCODE_STATE NAME=m729_saved_state
