# klicky.cfg — Klicky probe configuration for custom RP2040 bed MCU
# Include this from printer.cfg when using the RP2040 bed MCU option:
#   [include klicky.cfg]
# Also uncomment [mcu rp2040_bed] in machine.cfg.

# =============================================================================
# RP2040 bed MCU peripherals
# =============================================================================

[servo klicky_servo]
# MG90S 180-degree servo on RP2040 GP2
pin: rp2040_bed:gpio2
maximum_servo_angle: 180
minimum_pulse_width: 0.0005   # 0.5ms = 0°
maximum_pulse_width: 0.0025   # 2.5ms = 180°

[probe]
# Klicky contact probe on RP2040 GP3 (pulled up, active low)
pin: ^!rp2040_bed:gpio3
speed: 5
lift_speed: 10
samples: 3
sample_retract_dist: 2.0
samples_tolerance: 0.010
samples_tolerance_retries: 3
z_offset: 0.0   # calibrate with PROBE_CALIBRATE

# =============================================================================
# Servo angle placeholders — measure these on your physical build
# DEPLOY_ANGLE: servo position that swings the probe into the bed path
# STOW_ANGLE:   servo position that retracts the probe clear of the bed
# =============================================================================
[gcode_macro _KLICKY_VARS]
variable_deploy_angle:  45    # degrees — adjust for your swing arm geometry
variable_stow_angle:   135    # degrees — adjust for your swing arm geometry
variable_travel_speed: 8000
variable_z_hop:         5
gcode:

[gcode_macro KLICKY_DEPLOY]
gcode:
    {% set kv = printer["gcode_macro _KLICKY_VARS"] %}
    SET_SERVO SERVO=klicky_servo ANGLE={kv.deploy_angle}
    G4 P500   # wait 500ms for servo to reach position

[gcode_macro KLICKY_STOW]
gcode:
    {% set kv = printer["gcode_macro _KLICKY_VARS"] %}
    SET_SERVO SERVO=klicky_servo ANGLE={kv.stow_angle}
    G4 P500

# Override default probe attach/detach so Klipper calls our macros
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE
gcode:
    KLICKY_DEPLOY
    _BED_MESH_CALIBRATE {rawparams}
    KLICKY_STOW

[gcode_macro PROBE_CALIBRATE]
rename_existing: _PROBE_CALIBRATE
gcode:
    KLICKY_DEPLOY
    _PROBE_CALIBRATE {rawparams}
    KLICKY_STOW

[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: _SCREWS_TILT_CALCULATE
gcode:
    KLICKY_DEPLOY
    _SCREWS_TILT_CALCULATE {rawparams}
    KLICKY_STOW
