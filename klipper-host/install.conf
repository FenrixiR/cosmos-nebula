# klipper-host install configuration
# Edit this file before running install.sh.
# All setup scripts source this file.

# --- Network interfaces ---
# Ethernet interface that provides internet access (used by chrony, apt, etc.)
# Typically eth0 on Armbian/DSCS9. Check with: ip link show
# Common alternatives: end0, enp1s0, eth1
ETH_IFACE="eth0"

# --- WiFi Access Point ---
WIFI_IFACE="wlan0"
WIFI_AP_SSID="cosmos-nebula"       # must match [wifi] ssid in /etc/nebula.toml on Cosmos
WIFI_AP_PASSWORD="CHANGE_ME"        # must match [wifi] password in /etc/nebula.toml on Cosmos
WIFI_AP_CHANNEL="6"
WIFI_COUNTRY="GB"                   # ISO 3166-1 alpha-2 country code for regulatory compliance
WIFI_AP_IP="192.168.4.1"            # klipper-host WiFi interface IP (also the NTP/gateway for Cosmos)
DHCP_RANGE_START="192.168.4.2"
DHCP_RANGE_END="192.168.4.10"

# --- Cosmos static DHCP lease ---
# After first boot, find Cosmos MAC with: ip neigh show | grep 192.168.4
# Leave as XX:XX:XX:XX:XX:XX on first run — Cosmos will get a dynamic lease.
# Fill in and re-run install.sh to assign the static lease.
COSMOS_MAC="XX:XX:XX:XX:XX:XX"
COSMOS_IP="192.168.4.2"
COSMOS_HOSTNAME="cosmos-nebula"

# --- User to run Klipper/Moonraker as ---
# Defaults to the user who invoked sudo. Override if needed.
KLIPPER_USER="${SUDO_USER:-$(logname 2>/dev/null || echo klipper)}"

# --- Installation paths ---
KLIPPER_DIR="/home/$KLIPPER_USER/kalico"
KLIPPER_ENV="/home/$KLIPPER_USER/kalico-env"
MOONRAKER_DIR="/home/$KLIPPER_USER/moonraker"
MOONRAKER_ENV="/home/$KLIPPER_USER/moonraker-env"
KLIPPER_CONFIG_DIR="/etc/klipper"
MAINSAIL_DIR="/var/www/mainsail"
CROWSNEST_DIR="/home/$KLIPPER_USER/crowsnest"
