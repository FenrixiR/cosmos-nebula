# Cosmos-Nebula TCP Serial Bridge configuration
# Maps MCU serial devices to TCP ports for DSCS9 Klipper access.
# In DSCS9 printer.cfg, connect with: serial: socket://cosmos-nebula:PORT
#
# This file is generated from /etc/nebula.toml at boot (Phase 5).
# Manual edits here survive overlayfs-etc updates via CONFFILES.

# Mainboard DSP MCU (HiFi4 via remoteproc RPMSG).
# No baud field — ttyRPMSG0 is a virtual device; termios baud is ignored.
[[bridge]]
device = "/dev/ttyRPMSG0"
port   = 7001

# Bed MCU (STM32F401 or RP2040 — both use the same UART header).
[[bridge]]
device = "/dev/ttyS4"
port   = 7002
baud   = 250000

# Toolhead MCU (STM32F401, USB).
[[bridge]]
device = "/dev/serial/by-path/platform-4101400.usb-usb-0:1:1.0"
port   = 7003
baud   = 250000
